name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3-pyqt6 \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3
      - name: tests
        run: bash tests/run.sh

  release:
    # tag vX.Y.Z and this builds .deb/.rpm/Arch packages and puts them on
    # the GitHub release, so they can be downloaded straight from the repo.
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: nfpm
        run: |
          ver=2.48.0
          curl -sSfL -o nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/v$ver/nfpm_${ver}_Linux_x86_64.tar.gz"
          tar xzf nfpm.tar.gz nfpm
          sudo install -m 0755 nfpm /usr/local/bin/nfpm
      - name: build packages
        run: VERSION="${GITHUB_REF_NAME#v}" packaging/packages.sh dist
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
