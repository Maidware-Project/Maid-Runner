name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3-pyqt6 \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3
      - name: tests
        run: bash tests/run.sh
